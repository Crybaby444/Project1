# Render Blueprint for the Yoyo API (free web service, Docker, WebSocket-capable).
# Render → New → Blueprint → pick this repository. Secrets are entered in the dashboard.
services:
  - type: web
    name: yoyo-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # Signs access tokens. Render generates a random 256-bit value once; never set it by hand.
      - key: JWT_SECRET
        generateValue: true
      # Browser → Vercel proxy → Render load balancer → API: trust those two hops for the client address.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # The same value as PROXY_SECRET on Vercel (at least 32 characters). Set it on Vercel first: with it
      # the API trusts X-Forwarded-For only on requests from the site proxy (README, «Свой домен»).
      - key: PROXY_SECRET
        sync: false
      # At most this many emails per 24 hours (Resend's free tier sends 100 a day).
      - key: MAIL_DAILY_LIMIT
        value: "90"
      # Registrations per hour from all addresses together.
      - key: REGISTRATION_HOURLY_CAP
        value: "100"
      # Optional. Left empty, the feature is off and the API still starts (see README, «Аккаунты»).
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Listing photos on Cloudinary. Without CLOUDINARY_URL (cloudinary://<key>:<secret>@<cloud>, from the
      # Cloudinary console) the API still starts and photo uploads answer 503 (README, «Объявления»).
      - key: STORAGE
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      # No SMS_PROVIDER: production has no real SMS service yet, so phone confirmation stays off.

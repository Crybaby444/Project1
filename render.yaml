# Render Blueprint for the Yoyo API (free web service, Docker, WebSocket-capable).
# Render → New → Blueprint → pick this repository. Secrets are entered in the dashboard.
services:
  - type: web
    name: yoyo-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # Signs access tokens. Render generates a random 256-bit value once; never set it by hand.
      - key: JWT_SECRET
        generateValue: true

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yoyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yoyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yoyo_test
      WEB_ORIGIN: http://localhost:3000
      PORT: 4000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SHOW_STYLEGUIDE: 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @yoyo/api exec prisma migrate deploy

      - name: Lint, typecheck, unit tests and build
        run: pnpm turbo run lint typecheck test build --cache-dir=.turbo

      - name: Check formatting
        run: pnpm format:check

      - name: Generated API client is up to date
        run: |
          pnpm --filter @yoyo/api openapi:emit
          pnpm --filter @yoyo/api-client generate
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts

      - name: Install Playwright browser
        run: pnpm --filter @yoyo/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @yoyo/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

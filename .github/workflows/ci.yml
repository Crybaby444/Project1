name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yoyo
          POSTGRES_PASSWORD: yoyo
          POSTGRES_DB: yoyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yoyo -d yoyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Catches the mail the API sends (SMTP 1025, HTTP API 8025), as Mailpit does locally.
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # API (also used by the e2e API server)
      DATABASE_URL: postgresql://yoyo:yoyo@localhost:5432/yoyo_test
      TEST_DATABASE_URL: postgresql://yoyo:yoyo@localhost:5432/yoyo_test
      WEB_ORIGIN: http://localhost:3000
      # CI-only signing key (not a secret: it signs nothing outside this job).
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      SMTP_URL: smtp://localhost:1025
      # Web build (NEXT_PUBLIC_* are baked in at build time)
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SHOW_STYLEGUIDE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @yoyo/api exec prisma migrate deploy

      # Build runs after typecheck: `next build` wipes apps/web/.next while
      # `next typegen` writes .next/types/routes.d.ts, so running both at once races.
      - name: Lint, typecheck and unit tests
        run: pnpm turbo run lint typecheck test

      - name: Build
        run: pnpm turbo run build

      - name: Generated API client is up to date
        run: |
          pnpm --filter @yoyo/api openapi:emit
          pnpm --filter @yoyo/api-client generate
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts

      - name: Deploy wizard works end to end
        run: bash scripts/tests/setup-deploy.test.sh

      - name: Install Playwright Chromium
        run: pnpm --filter @yoyo/web exec playwright install --with-deps chromium

      # WebKit runs in its own job (below), in an image that already has its system libraries.
      - name: End-to-end tests
        run: pnpm --filter @yoyo/web e2e --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  webkit:
    name: Language switch on an iPhone (WebKit e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The Playwright image of the pinned @playwright/test version: WebKit and the system libraries it
    # needs are already there (installing them with apt took the whole time budget of the main job).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yoyo
          POSTGRES_PASSWORD: yoyo
          POSTGRES_DB: yoyo_test
        options: >-
          --health-cmd "pg_isready -U yoyo -d yoyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.33.0
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Inside a container job the services are reached by their names.
      DATABASE_URL: postgresql://yoyo:yoyo@postgres:5432/yoyo_test
      WEB_ORIGIN: http://localhost:3000
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      SMTP_URL: smtp://mailpit:1025
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SHOW_STYLEGUIDE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @yoyo/api exec prisma migrate deploy

      - name: Build the API and the site
        run: pnpm turbo run build --filter=@yoyo/api --filter=@yoyo/web

      - name: End-to-end tests on an iPhone (WebKit)
        run: pnpm --filter @yoyo/web e2e --project=webkit-iphone

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: API Docker image builds and serves health
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yoyo
          POSTGRES_PASSWORD: yoyo
          POSTGRES_DB: yoyo_prod_like
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yoyo -d yoyo_prod_like"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Build image (same Dockerfile Render uses)
        run: docker build -f apps/api/Dockerfile -t yoyo-api .

      - name: Start the container like production
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://yoyo:yoyo@localhost:5432/yoyo_prod_like \
            -e WEB_ORIGIN=https://yoyo.example \
            -e JWT_SECRET=ci-docker-only-jwt-secret-not-a-real-one \
            -e TRUST_PROXY_HOPS=2 \
            -e PORT=4100 \
            yoyo-api

      - name: Migrations ran and health is ok
        run: |
          for attempt in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:4100/api/v1/health); then
              echo "$body"
              echo "$body" | grep -q '"status":"ok"' && exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Swagger UI is hidden in production
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4100/api/docs)" = "404"

      - name: Registration works in the production image (argon2 binary, Secure cookies, mail disabled)
        run: |
          code=$(curl -s -o register.json -D register.headers -w '%{http_code}' \
            -X POST http://localhost:4100/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-smoke@yoyo.example","password":"correct horse battery","name":"CI"}')
          cat register.json; echo
          test "$code" = "201"
          grep -qi '^set-cookie: yoyo_at=.*; Secure' register.headers
          for attempt in $(seq 1 10); do
            docker logs api 2>&1 | grep -q 'mail disabled: verify-email to c\*\*\*@yoyo.example' && exit 0
            sleep 1
          done
          echo "expected a 'mail disabled' log line"; exit 1

      - name: Photo processing works in the image and uploads are off without Cloudinary
        run: |
          docker exec -w /app api node -e "const s = require('sharp'); console.log('sharp', s.versions.sharp, 'libvips', s.versions.vips)"
          docker logs api 2>&1 | grep -q 'STORAGE is not set: photo uploads are disabled'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4100/api/v1/categories)" = "200"

      - name: Container logs
        if: always()
        run: docker logs api || true
